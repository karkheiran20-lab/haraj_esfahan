<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتقال به کانال حراج اصفهان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, Segoe UI, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 350px;
            width: 100%;
        }
        h2 { color: #2c3e50; font-size: 18px; margin-bottom: 12px; }
        p { color: #666; font-size: 13px; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            display: block;
            background-color: #e67e22;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
            box-shadow: 0 3px 6px rgba(230, 126, 34, 0.3);
        }
        .btn-alt {
            background-color: #3498db;
            box-shadow: 0 3px 6px rgba(52, 152, 219, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>کانال حراج اصفهان</h2>
    <p>جهت ورود به کانال، یکی از دکمه‌های زیر را انتخاب کنید:</p>
    
    <!-- روش اول: دیپ‌لینک مستقیم -->
    <a href="eitaa://join?space=haraj_esfahan" class="btn">ورود مستقیم به اپلیکیشن ایتا</a>
    
    <!-- روش دوم: لینک وب ایتا (باز شدن در مرورگر/ایتا) -->
    <a href="https://eitaa.com/haraj_esfahan" class="btn btn-alt">ورود از طریق وب‌سایت ایتا</a>
</div>

<script>
    // تلاش برای فراخوانی خودکار هنگام بارگذاری صفحه
    window.onload = function() {
        setTimeout(function() {
            window.location.href = "eitaa://join?space=haraj_esfahan";
        }, 500);
    };
</script>

</body>
</html>
